<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK Culture Sampler — Test 1</title><style>*{box-sizing:border-box}body{margin:0;background:#222;color:#eee;font:15px system-ui}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:24px;margin:0}small{color:#bbb}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{font:inherit;padding:10px;border:1px solid #777;border-radius:5px;background:#333;color:white}button:disabled{opacity:.4}canvas{width:100%;height:auto;background:#e8dfcc;display:block}#status{min-height:44px;padding:10px 0}a{color:#b8d9ff}details{margin-top:12px}li{margin:6px 0}</style><main><h1>TK CULTURE SAMPLER — Test 1</h1><small>by Kris & Omnia 2026</small><nav><select id="mode"><option value="mix">Culturele botsing</option><option value="news">Actualiteit</option><option value="vintage">Vintage Pop</option></select><button id="start">START</button><button id="stop" disabled>STOP</button><button id="reset">Nieuwe collage</button><button id="save">Bewaar PNG</button></nav><canvas id="c" width="1500" height="1050"></canvas><div id="status" role="status">Druk START om echte beelden te verzamelen.</div><details><summary>Beeldbronnen en licenties</summary><ol id="sources"></ol></details></main><script>
'use strict';const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),W=c.width,H=c.height;let running=false,epoch=0,count=0,pool=[],seen=new Set();const r=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];const terms={mix:['vintage advertising poster','consumer electronics','fashion photography','street photography','political demonstration','food packaging','cinema poster','space exploration','newspaper front page','architecture'],vintage:['1950s advertisement','1960s advertising poster','vintage magazine cover','retro television','vintage automobile advertisement','public domain fashion illustration'],news:['demonstration','election campaign','press conference','climate protest','international summit','public transport']};function paper(){g.fillStyle='#e8dfcc';g.fillRect(0,0,W,H);for(let i=0;i<18000;i++){g.fillStyle=`rgba(60,40,20,${r(.015,.08)})`;g.fillRect(r(0,W),r(0,H),r(1,3),r(1,3))}}paper();function plain(s){const d=new DOMParser().parseFromString(s||'','text/html');return d.body.textContent||''}async function fetchPool(mode){let q=pick(terms[mode]);let p=new URLSearchParams({action:'query',generator:'search',gsrsearch:q+' filetype:bitmap',gsrnamespace:'6',gsrlimit:'24',prop:'imageinfo',iiprop:'url|mime|extmetadata',iiurlwidth:'900',format:'json',origin:'*'});if(mode==='news'){p.set('gsrsearch',q+' filetype:bitmap');p.set('gsrsort','create_timestamp_desc')}let res=await fetch('https://commons.wikimedia.org/w/api.php?'+p,{signal:AbortSignal.timeout(18000)});if(!res.ok)throw Error('Beeldbank HTTP '+res.status);let j=await res.json();if(j.error)throw Error(j.error.info);return Object.values(j.query?.pages||{}).filter(x=>{let a=x.imageinfo?.[0];return a?.thumburl&&['image/jpeg','image/png','image/webp'].includes(a.mime)&&!seen.has(x.pageid)}).map(x=>({id:x.pageid,title:x.title.replace(/^File:/,''),...x.imageinfo[0]}))}function load(url){return new Promise((ok,no)=>{let im=new Image();im.crossOrigin='anonymous';let t=setTimeout(()=>no(Error('Beeld te traag')),16000);im.onload=()=>{clearTimeout(t);ok(im)};im.onerror=()=>{clearTimeout(t);no(Error('Beeld niet toegankelijk'))};im.src=url})}function draw(im){let w=count===0?r(650,950):r(190,680),h=w*r(.65,1.35),x=count===0?W/2:r(80,W-80),y=count===0?H/2:r(65,H-65);let sw=im.width*r(.55,1),sh=im.height*r(.55,1),sx=r(0,im.width-sw),sy=r(0,im.height-sh);g.save();g.translate(x,y);g.rotate(r(-.27,.27));g.beginPath();let shape=Math.random();if(shape<.23){g.ellipse(0,0,w/2,h/2,0,0,Math.PI*2)}else if(shape<.78){for(let i=0;i<40;i++){let side=Math.floor(i/10),t=(i%10)/10,xx,yy;if(side===0){xx=-w/2+w*t;yy=-h/2}else if(side===1){xx=w/2;yy=-h/2+h*t}else if(side===2){xx=w/2-w*t;yy=h/2}else{xx=-w/2;yy=h/2-h*t}xx+=r(-9,9);yy+=r(-9,9);i?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.closePath()}else{g.rect(-w/2,-h/2,w,h)}g.shadowColor='#0006';g.shadowBlur=8;g.shadowOffsetY=5;g.fillStyle='#fff';g.fill();g.shadowColor='transparent';g.clip();let scale=Math.max(w/sw,h/sh);let cw=w/scale,ch=h/scale;g.filter=pick(['none','none','contrast(1.25) saturate(1.5)','grayscale(1) contrast(1.3)','sepia(.65) contrast(1.2)']);g.drawImage(im,sx+(sw-cw)/2,sy+(sh-ch)/2,cw,ch,-w/2,-h/2,w,h);g.filter='none';if(Math.random()<.22){g.fillStyle=pick(['#e62b4780','#ffca3280','#00a6c680']);g.globalCompositeOperation='multiply';g.fillRect(-w/2,-h/2,w,h)}g.restore();count++}function source(a){let li=document.createElement('li'),link=document.createElement('a');link.href=a.descriptionurl||'https://commons.wikimedia.org/?curid='+a.id;link.target='_blank';link.rel='noopener';link.textContent=a.title;li.append(link,document.createTextNode(' — '+plain(a.extmetadata?.Artist?.value)+' — '+(a.extmetadata?.LicenseShortName?.value||'Controleer licentie op bronpagina')));$('sources').append(li)}function stop(){running=false;epoch++;$('start').disabled=false;$('stop').disabled=true}async function run(){if(running)return;running=true;let e=++epoch,fail=0;$('start').disabled=true;$('stop').disabled=false;while(running&&e===epoch){try{$('status').textContent='Zoekt echte beelden op Wikimedia Commons… ('+count+' fragmenten)';if(!pool.length){let next=await fetchPool($('mode').value);if(e!==epoch)return;pool=next;if(!pool.length)throw Error('Geen nieuwe beelden gevonden')}let a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];seen.add(a.id);let im=await load(a.thumburl);if(e!==epoch)return;draw(im);source(a);fail=0;$('status').textContent=count+' fragmenten — '+a.title;if(count>=35){stop();$('status').textContent='Collage voltooid: 35 fragmenten. Bewaar of begin opnieuw.';return}}catch(err){if(e!==epoch)return;fail++;$('status').textContent=err.message+' — nieuwe poging '+fail+'/5';if(fail>=5){stop();$('status').textContent='Ophalen mislukt: '+err.message+'. Controleer internet of probeer opnieuw.';return}}await new Promise(ok=>setTimeout(ok,1100))}}$('start').onclick=()=>{if(count>=35){$('status').textContent='Begin eerst een nieuwe collage.';return}run()};$('stop').onclick=()=>{stop();$('status').textContent='Gestopt — '+count+' fragmenten'};$('reset').onclick=()=>{stop();count=0;pool=[];seen.clear();$('sources').replaceChildren();paper();$('status').textContent='Nieuwe collage — druk START'};$('mode').onchange=()=>{stop();pool=[];$('status').textContent='Nieuwe broncategorie geselecteerd. Druk START.'};$('save').onclick=()=>{try{c.toBlob(b=>{if(!b){$('status').textContent='Export mislukt';return}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='TK-Culture-Sampler-'+Date.now()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)},'image/png')}catch(e){$('status').textContent='Export mislukt: '+e.message}};
</script></html>
